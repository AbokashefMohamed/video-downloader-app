<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Purple-Blue Gradient -->
    <linearGradient id="purpleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />   <!-- Bright Purple -->
      <stop offset="100%" stop-color="#2563EB" />  <!-- Royal Blue -->
    </linearGradient>
  </defs>

  <!-- Main Clapperboard Frame with Rounded Corners -->
  <rect x="2" y="5" width="28" height="22" rx="3" fill="url(#purpleBlue)" />

  <!-- White Top Stripes -->
  <path d="M4 6h5l-3 4H4V6zm7 0h5l-3 4h-5l3-4zm7 0h5l-3 4h-5l3-4zm7 0h3v1l-3 3h-3l3-4z" fill="#FFFFFF" opacity="0.85" />
  
  <!-- Divider Line -->
  <line x1="2" y1="11" x2="30" y2="11" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

  <!-- Download Arrow -->
  <path d="M16 13v9m0 0l-3.5-3.5M16 22l3.5-3.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Base Tray/Line for Arrow -->
  <line x1="11" y1="24" x2="21" y2="24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
